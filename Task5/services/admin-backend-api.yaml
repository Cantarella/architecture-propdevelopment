apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend-app
  namespace: backend
  labels:
    role: backend-developer
spec:
  replicas: 1
  selector:
    matchLabels:
      role: backend-developer
  template:
    metadata:
      labels:
        app: admin-backend-app
        role: backend-developer
    spec:
      containers:
        - name: nginx
          image: nginx

---
apiVersion: v1
kind: Service
metadata:
  name: admin-backend-api
  namespace: backend
  labels:
    role: backend-developer
spec:
  selector:
    app: admin-backend-app
    role: backend-developer
  ports:
    - port: 80