apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend
  labels:
    role: backend-developer
spec:
  replicas: 1
  selector:
    matchLabels:
      role: backend-developer
  template:
    metadata:
      labels:
        app: backend-api
        role: backend-developer
    spec:
      containers:
        - name: nginx
          image: nginx

---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: backend
  labels:
    role: backend-developer
spec:
  selector:
    app: backend-api
    role: backend-developer
  ports:
    - port: 80