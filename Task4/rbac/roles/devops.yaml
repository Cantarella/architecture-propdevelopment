apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: development
  name: devops-engineer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: [ "get", "list", "create", "delete", "watch" ]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]